<!-- FRONT TEMPLATE: Word Card -->
<div class="card-front">
    <div class="card-container">

        <!-- Header: Word + Audio + Dictionary Link + IPA + Part of Speech -->
        <div class="word-header">
            <div class="word-row">
                <span class="word">{{Word}}</span>
                <div class="word-actions">
                    {{#Audio}}
                    <span class="audio-button-wrap" title="Pronounce">
                        {{Audio}}
                    </span>
                    {{/Audio}}
                    <a href="https://dictionary.cambridge.org/dictionary/english/{{Word}}" class="dict-link"
                        title="Open Cambridge Dictionary" target="_blank">📖</a>
                </div>
            </div>
            <div class="word-meta">
                {{#IPA}}<span class="phonetic" id="ipaFront">{{IPA}}</span>{{/IPA}}
                {{#PartOfSpeech}}<span class="pos">{{PartOfSpeech}}</span>{{/PartOfSpeech}}
            </div>
        </div>

        <!-- Image (if available) -->
        {{#image}}
        <div class="image-container">
            {{image}}
        </div>
        {{/image}}

        <!-- Example Sentence (Contextual Clue) -->
        {{#ExampleSentence}}
        <div class="example-section example-front">
            <div class="example-header">
                <span class="section-label">Example Clue:</span>
            </div>
            <span class="example-text" id="exampleFront">{{ExampleSentence}}</span>
        </div>
        {{/ExampleSentence}}

    </div>
</div>

<!-- Hidden fields for JS -->
<div id="wordValue" style="display:none;">{{Word}}</div>
